<div class="dashboard-header">
  <h1>Dashboard</h1>
</div>

<div class="dashboard-container">
  <p>Welcome to the CRM Dashboard!</p>
  <div class="dashboard-content">
    <div class="card">
      <h2>Total Customers</h2>
      <p class="number">1,234</p>
    </div>
    <div class="card">
      <h2>Total Sales</h2>
      <p class="number">$45,678</p>
    </div>
    <div class="card">
      <h2>Active Deals</h2>
      <p class="number">42</p>
    </div>
    <div class="card">
      <h2>Conversion Rate</h2>
      <p class="number">12.5%</p>
    </div>
  </div>

  <!-- Charts Section -->
  <div class="charts-section">
    <!-- Bar Chart - Total Sales Per Month -->
    <div class="chart-container">
      <h3 class="chart-title">Total Sales Per Month</h3>
      <kendo-chart class="bar-chart">
        <kendo-chart-legend position="bottom"></kendo-chart-legend>
        <kendo-chart-tooltip format="Sales: $#,##0"></kendo-chart-tooltip>
        <kendo-chart-series>
          <kendo-chart-series-item type="column" [data]="barChartData" field="value" categoryField="category" color="#0066CC" [gap]="0.2" [spacing]="0.1"></kendo-chart-series-item>
        </kendo-chart-series>
        <kendo-chart-x-axis type="category">
          <kendo-chart-x-axis-item field="category"></kendo-chart-x-axis-item>
          <kendo-chart-x-axis-line-style width="0"></kendo-chart-x-axis-line-style>
          <kendo-chart-x-axis-grid-lines visible="false"></kendo-chart-x-axis-grid-lines>
        </kendo-chart-x-axis>
        <kendo-chart-y-axis>
          <kendo-chart-y-axis-item format="$#,##0"></kendo-chart-y-axis-item>
          <kendo-chart-y-axis-line-style width="0"></kendo-chart-y-axis-line-style>
          <kendo-chart-y-axis-grid-lines [visible]="true" dashType="dot" [width]="1" color="#999"></kendo-chart-y-axis-grid-lines>
          <kendo-chart-y-axis-minor-grid-lines [visible]="false"></kendo-chart-y-axis-minor-grid-lines>
        </kendo-chart-y-axis>
      </kendo-chart>
    </div>

    <!-- Pie Chart - Customer Ratings -->
    <div class="chart-container">
      <h3 class="chart-title">Customer Ratings Distribution</h3>
      <kendo-chart>
        <kendo-chart-legend position="bottom"></kendo-chart-legend>
        <kendo-chart-tooltip format="#= category #: #= value # customers"></kendo-chart-tooltip>
        <kendo-chart-series>
          <kendo-chart-series-item type="pie" [data]="pieChartData" field="value" categoryField="category"></kendo-chart-series-item>
        </kendo-chart-series>
      </kendo-chart>
    </div>
  </div>
</div>
